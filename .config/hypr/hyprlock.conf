general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/winbox4-graphite.png
    blur_passes = 0
    blur_size = 8
    brightness = 1.0
}

label {
    monitor =
    text = cmd[update:1000] TZ=Europe/Moscow date +"%H:%M"
    color = rgba(d5dce2ff)
    font_size = 110
    font_family = IBM Plex Sans Condensed SemiBold
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] TZ=Europe/Moscow date +"%A, %d %B"
    color = rgba(93a1b0ff)
    font_size = 20
    font_family = IBM Plex Sans
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "Hong Kong  $(TZ=Asia/Hong_Kong date +%H:%M)"
    color = rgba(a3afb9ff)
    font_size = 16
    font_family = IBM Plex Sans
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    outer_color = rgba(62b0e8ff)
    inner_color = rgba(20282fff)
    font_color = rgba(d5dce2ff)
    check_color = rgba(74c69dff)
    fail_color = rgba(e5737aff)
    fade_on_empty = false
    rounding = 3
    placeholder_text = <i>Пароль...</i>
    dots_center = true
    position = 0, -80
    halign = center
    valign = center
}
