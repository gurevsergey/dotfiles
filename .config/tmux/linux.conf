# vim: ft=tmux
# Linux counterpart of macos.conf (kitty + Wayland)

# true colour in kitty
set -as terminal-overrides ',xterm-kitty:RGB'
# italic support
set -as terminal-overrides ',xterm*:sitm=\E[3m'
# undercurl support
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# underscore colours - needs tmux-3.0
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# copy selected text to the Wayland clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Open current directory (bindings.conf uses macOS `open`; this file is sourced after it)
bind o run-shell -b "xdg-open '#{pane_current_path}'"
