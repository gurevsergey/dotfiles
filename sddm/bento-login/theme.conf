[General]
# ── Картинка в левой карточке (путь относительно папки темы или абсолютный) ──
background=background.png
# cover-масштабирование; прозрачность картинки поверх цвета карточки (0..1)
backgroundOpacity=1.0

# ── Шрифты: файлы из fonts/ подключаются через FontLoader ──
fontDisplay=fonts/ArchivoBlack-Regular.ttf
fontSans=fonts/SpaceGrotesk.ttf
fontMono=fonts/JetBrainsMonoNerdFontMono-Regular.ttf
fontMonoBold=fonts/JetBrainsMonoNerdFontMono-Bold.ttf
# Для иероглифов нужен системный CJK-шрифт (имя семейства, не файл)
fontCjk=IBM Plex Sans JP

# ── Сведения о ПК ──
# Файл пишет bento-sysinfo.sh (systemd: bento-sysinfo.service + .timer).
# Пусто — не читать. Перечитывается раз в sysinfoRefresh секунд.
sysinfoFile=/var/lib/bento-login/SysInfo.qml
sysinfoRefresh=120
# Что показать, если значения нет (файл не создан, нет сети)
missingValue=—
#
# Подстановки в любом тексте ниже:
#   %HOST% %OS% %KERNEL% %KERNEL_SHORT% %PKGS%
#   %CPU% %CORES% %GPU% %GPU_SHORT% %GPU_DRV% %RAM% %DISK% %DISK_FREE%
#   %IP% %IFACE% %BOOT_TIME% %LAST_USER% %LAST_LOGIN% %UPDATED%
#   живые: %UPTIME% %SESSIONS% %SESSION_NO% %USERS% %LAYOUT%

# ── Тексты ──
title=EVANGELION
artIndex=01
artCaption=%OS%\nkernel %KERNEL_SHORT%
artGlyphs=独創
authCode=%HOST%
authMid=%IFACE% · %IP%
authLabel=AUTH
authDenied=ACCESS DENIED
userLabel=USER
passLabel=PASSKEY
# Показывать логин заглавными (только отображение, вводится как есть)
userUppercase=true
description=CPU   %CPU% · %CORES%\nGPU   %GPU_SHORT% · %GPU_DRV%\nRAM   %RAM%\nDISK  %DISK%\nPKGS  %PKGS%\n\nIdentity verified at the edge. Every session is a negotiation between the machine and whoever remembers the password.
sessionTag=DE
sessionHint=SELECT SESSION\nBEFORE LOGIN\n%SESSION_NO% / %SESSIONS%
copyright=LAST LOGIN\n%LAST_USER% · %LAST_LOGIN%
clockCaption=Uptime %UPTIME%\nboot %BOOT_TIME%

# ── Цветовые пресеты (листаются стрелками ‹ › и точками) ──
paletteCount=3
defaultPalette=1

# 1 — оригинал: красный / охра / зелёный / серый
palette1_name=Unit-01
palette1_background=#0b0b0b
palette1_art=#c8312b
palette1_main=#e0a060
palette1_session=#6fa06a
palette1_clock=#a8a8a8
palette1_accent=#d43a2f
palette1_ink=#0b0b0b

# 2 — Unit-00: синий / лёд / песок / графит
palette2_name=Unit-00
palette2_background=#0a0c10
palette2_art=#2b5fc8
palette2_main=#d9dde4
palette2_session=#e0c890
palette2_clock=#8a96a8
palette2_accent=#2b5fc8
palette2_ink=#0b0d12

# 3 — Unit-02 / NERV: пурпур / лайм
palette3_name=NERV
palette3_background=#0b0a0d
palette3_art=#6b3fa0
palette3_main=#9fd356
palette3_session=#e07b39
palette3_clock=#c9c3b6
palette3_accent=#6b3fa0
palette3_ink=#0b0b0b
